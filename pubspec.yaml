name: memora_core
description: A Flutter app for Memora Core with all API features

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^16.3.0
  record: ^5.0.4
  permission_handler: ^11.2.0
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.18
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/