<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memora - Memory Management App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --dark-color: #1f2937;
            --light-color: #f9fafb;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
        }

        .memory-card {
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .memory-card:hover {
            transform: translateY(-5px);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .stats-card {
            background: linear-gradient(45deg, var(--success-color), var(--primary-color));
            color: white;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-brain me-2"></i>Memora
            </a>
            <div class="navbar-nav ms-auto" id="navItems">
                <a class="nav-link" href="#" onclick="showLogin()">Login</a>
                <a class="nav-link" href="#" onclick="showRegister()">Register</a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container mt-5" id="loginForm">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Welcome Back</h3>
                        <form id="loginFormElement">
                            <div class="mb-3">
                                <label class="form-label">Email or Username</label>
                                <input type="text" class="form-control" id="loginEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <span id="loginBtnText">Login</span>
                                <span id="loginBtnLoading" class="loading hidden"></span>
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="#" onclick="showRegister()">Don't have an account? Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Register Form -->
    <div class="container mt-5 hidden" id="registerForm">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Create Account</h3>
                        <form id="registerFormElement">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="registerUsername" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="registerEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="registerPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <span id="registerBtnText">Register</span>
                                <span id="registerBtnLoading" class="loading hidden"></span>
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="#" onclick="showLogin()">Already have an account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="container mt-4 hidden" id="dashboard">
        <!-- Stats Row -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-brain fa-2x mb-2"></i>
                        <h4 id="totalMemories">0</h4>
                        <p class="mb-0">Total Memories</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-clock fa-2x mb-2"></i>
                        <h4 id="todayMemories">0</h4>
                        <p class="mb-0">Today's Memories</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-star fa-2x mb-2"></i>
                        <h4 id="importantMemories">0</h4>
                        <p class="mb-0">Important</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-users fa-2x mb-2"></i>
                        <h4 id="sharedMemories">0</h4>
                        <p class="mb-0">Shared</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quick Add Memory -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Quick Add Memory</h5>
                        <form id="quickAddForm">
                            <div class="row">
                                <div class="col-md-8">
                                    <input type="text" class="form-control" id="quickMemoryContent" placeholder="What's on your mind?" required>
                                </div>
                                <div class="col-md-2">
                                    <select class="form-select" id="quickMemoryImportance">
                                        <option value="1">Low</option>
                                        <option value="2" selected>Medium</option>
                                        <option value="3">High</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-plus"></i> Add
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Memories List -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Recent Memories</h5>
                            <button class="btn btn-outline-primary" onclick="showCreateMemory()">
                                <i class="fas fa-plus"></i> New Memory
                            </button>
                        </div>
                        <div id="memoriesList">
                            <!-- Memories will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Memory Modal -->
    <div class="modal fade" id="createMemoryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Memory</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createMemoryForm">
                        <div class="mb-3">
                            <label class="form-label">Memory Content</label>
                            <textarea class="form-control" id="memoryContent" rows="4" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Importance</label>
                                <select class="form-select" id="memoryImportance">
                                    <option value="1">Low</option>
                                    <option value="2" selected>Medium</option>
                                    <option value="3">High</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tags</label>
                                <input type="text" class="form-control" id="memoryTags" placeholder="work, personal, ideas">
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                            <label class="form-label">AI Enhancement</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="aiEnhancement" checked>
                                <label class="form-check-label" for="aiEnhancement">
                                    Use AI to enhance and categorize this memory
                                </label>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createMemory()">
                        <span id="createBtnText">Create Memory</span>
                        <span id="createBtnLoading" class="loading hidden"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
